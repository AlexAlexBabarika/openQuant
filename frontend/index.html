<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenQuant — Research workspace</title>
    <meta
      name="description"
      content="A self-hosted research workspace for market data, strategy backtesting and reproducible analysis. Educational software, not investment advice."
    />
    <link rel="icon" href="data:," />
    <script>
      (function () {
        try {
          var t = localStorage.getItem('openquant:theme');
          if (t !== 'light') document.documentElement.classList.add('dark');
        } catch (_) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
