name: Docker Build

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'frontend/**'
      - 'backend/**'
      - 'shared/**'
  pull_request:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'frontend/**'
      - 'backend/**'
      - 'shared/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  compose-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - run: docker compose --env-file /dev/null up --build --wait --wait-timeout 180
        env:
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
      - name: Verify UI, chart data, account lifecycle, and persistence
        env:
          DOCKER_DEFAULT_PLATFORM: ${{ matrix.platform }}
        run: |
          curl --fail --retry 5 http://127.0.0.1:8000/
          curl --fail --cookie-jar /tmp/openquant-cookies \
            --header 'Content-Type: application/json' \
            --data '{"email":"compose-smoke@example.com","password":"smoke-test-password"}' \
            http://127.0.0.1:8000/auth/signup
          curl --fail --retry 3 --retry-all-errors \
            'http://127.0.0.1:8000/data/market?symbol=AAPL&provider=yfinance&period=5d&interval=1d'
          curl --fail --cookie /tmp/openquant-cookies \
            --request POST http://127.0.0.1:8000/auth/logout
          curl --fail --cookie-jar /tmp/openquant-cookies \
            --header 'Content-Type: application/json' \
            --data '{"email":"compose-smoke@example.com","password":"smoke-test-password"}' \
            http://127.0.0.1:8000/auth/login
          docker compose down
          docker compose up --wait --wait-timeout 180
          curl --fail --cookie-jar /tmp/openquant-cookies \
            --header 'Content-Type: application/json' \
            --data '{"email":"compose-smoke@example.com","password":"smoke-test-password"}' \
            http://127.0.0.1:8000/auth/login
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes
