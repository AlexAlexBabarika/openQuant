name: E2E

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'shared/**'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'shared/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.14-alpine3.23
        env:
          POSTGRES_DB: openquant
          POSTGRES_USER: openquant
          POSTGRES_PASSWORD: openquant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openquant -d openquant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://openquant:openquant@127.0.0.1:5432/openquant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps --only-shell chromium
        working-directory: frontend
      - name: Serve the build from the backend
        run: |
          python -m uvicorn backend.app:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          curl --fail --retry 30 --retry-delay 1 --retry-all-errors http://127.0.0.1:8000/health
      - run: npm run test:e2e
        working-directory: frontend
      - name: Show backend log on failure
        if: failure()
        run: cat backend.log
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
